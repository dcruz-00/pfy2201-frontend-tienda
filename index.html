<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16bit</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:ital,wght@0,100..900;1,100..900&family=VT323&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header" id="inicio">
        <div class="marca">
            <h1>16bit</h1>
            <p class="subtitulo">Tienda de consolas, videojuegos y accesorios retro.</p>
        </div>
    </header>
    <nav class="nav">
        <ul>
            <li><a href="#inicio">Inicio</a></li>
            <li><a href="#productos">Productos</a></li>
            <li><a href="#contacto">Contacto</a></li>
        </ul>
    </nav>
    <main>
        <section class="box" id="productos">
            <h2>Productos destacados</h2>
            <ul class="grid-productos">
                <li>
                    <figure>
                        <div class="imagen-producto">
                            <img src="img/dreamcast.jpg" alt="Consola Sega Dreamcast" width="300">
                        </div>
                        <figcaption>Consola retro Sega Dreamcast, incluye control original.</figcaption>
                    </figure>
                    <h3>Sega Dreamcast</h3>
                </li>
                <li>
                    <figure>
                        <div class="imagen-producto">
                            <img src="img/dk-country-snes.jpg" alt="DK Country SNES" width="300">
                        </div>
                        <figcaption>Juego para Super Nintendo Donkey Kong Country.</figcaption>
                    </figure>
                    <h3>Donkey Kong Country - Super Nintendo</h3>
                </li>
                <li>
                    <figure>
                        <div class="imagen-producto">
                            <img src="img/control-gc-morado.jpg" alt="Control GC morado" width="300">
                        </div>
                        <figcaption>Control para Nintendo Gamecube original.</figcaption>
                    </figure>
                    <h3>Control Nintendo Gamecube</h3>
                </li>
            </ul>
        </section>
    </main>
    <footer class="footer" id="contacto">
        <h2>Contacto</h2>
        <address>
            <p>Dirección: Av. Los Alerces 123, Santiago, Chile</p>
            <p>Email: <a href="mailto:contacto@16bit.cl">contacto@16bit.cl</a></p>
        </address>
    </footer>
</body>

</html>
